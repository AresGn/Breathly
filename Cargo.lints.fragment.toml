# À fusionner dans le Cargo.toml de l'application. Non éprouvé : vérifier dans la documentation de Cargo (table [lints]).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
