# Configuration du projet : lue par le Makefile, les hooks, la CI et les scripts de tools/.
# Fichier shell (sourcé). Une seule source de vérité : modifier ici, pas dans les scripts.

PROJECT_NAME="Breathly"
PROJECT_SLUG="breathly"        # minuscules, tirets, sans espace
REPO="AresGn/Breathly"                        # organisation/nom sur GitHub
DEFAULT_BRANCH="main"

# Variable d'environnement qui autorise le propriétaire à pousser sur la branche par défaut (documentation, décisions).
# Tant que la protection de branche GitHub n'est pas activée (dépôt privé, compte gratuit), c'est le hook de pré-push qui protège.
ALLOW_MAIN_VAR="BREATHLY_ALLOW_MAIN"

# Applications du projet : "chemin:pile" séparées par des espaces.
# La pile désigne tools/stacks/<pile>.sh (outils) ; son CODING.md vit dans le dossier de l'application.
# Exemple : APPS="apps/api:php-laravel apps/mobile:dart-flutter apps/admin:typescript-nextjs"
APPS=".:rust extension:node-api"

# Délai minimal (jours) avant d'installer une version publiée ou d'épingler une action GitHub.
MIN_RELEASE_AGE_DAYS=7
