<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>N3 · Nettoyage en cours</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./breathly.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="gal" style="width: 2064px; min-height: 1800px">
<svg class="spr" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" style="fill:var(--color-accent)"/><circle cx="16" cy="16" r="4.5" style="fill:var(--color-on-accent)"/><circle cx="16" cy="16" r="9.5" style="fill:none;stroke:var(--color-on-accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:44 16"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
  <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M5.5 14 8 4h8l2.5 10"/><path d="M7 17.5h.01M11 17.5h.01"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 4v4.5H8"/><path d="M12 8v4.5l3 2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8h.01"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></symbol>
</svg>

<h1 class="gal-title">N3 · Nettoyage en cours</h1>
<p class="gal-note">US-036.3, parcours 4. Progression par éléments. Le bouton Arrêter termine l’élément en cours, puis s’arrête : le cadre de droite montre l’arrêt demandé. Le résultat est ensuite affiché sur N4 (« arrêté par vous »).</p>

<div class="gal-grid">
<sc-for list="{{wins}}" as="w" hint-placeholder-count="3">
<figure class="gal-fig">
  <figcaption class="gal-cap">{{w.caption}}</figcaption>
  <div class="win" data-theme="{{w.theme}}" lang="fr">
    <aside class="side">
      <div class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#mark"/></svg><span class="brand-name">Breathly</span></div>
      <nav class="nav" aria-label="Navigation principale">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
        <a href="#" aria-current="{{n.current}}" aria-label="{{n.label}}"><svg class="ic" aria-hidden="true"><use href="{{n.icon}}"/></svg><span class="nav-label">{{n.label}}</span></a>
        </sc-for>
      </nav>
      <p class="side-foot">Tout reste sur votre ordinateur.</p>
    </aside>

    <section class="main" style="gap: 20px">
      <div class="head">
        <h1 class="h1">Nettoyage en cours…</h1>
        <p class="lead">Ne fermez pas Breathly. Chaque élément est noté dans l’historique avant d’être traité.</p>
      </div>

      <sc-if value="{{w.stopping}}" hint-placeholder-val="{{ false }}">
      <div class="banner banner--info" role="status">
        <svg class="ic" aria-hidden="true"><use href="#i-info"/></svg>
        <div class="grow"><span class="banner-title">Arrêt demandé.</span> Breathly termine l’élément en cours (Cache de Firefox), puis s’arrête.</div>
      </div>
      </sc-if>

      <div class="card stack" style="gap: 12px">
        <div class="row row--between"><span class="h3">2 éléments sur 5</span><span class="num muted">Libéré jusqu’ici : <b>10,3 Go</b></span></div>
        <div class="meter meter--lg" role="img" aria-label="Progression : 2 éléments sur 5"><i style="width: 46%"></i></div>
      </div>

      <div class="card card--flush">
        <div class="list">
          <div class="item item--static" style="min-height: 56px"><svg class="ic" aria-hidden="true" style="color: var(--color-success-fg)"><use href="#i-check"/></svg><span class="item-main"><span class="item-name">Cache de npm</span></span><span class="status status--ok">Supprimé</span><span class="item-size">4,2 Go</span></div>
          <div class="item item--static" style="min-height: 56px"><svg class="ic" aria-hidden="true" style="color: var(--color-success-fg)"><use href="#i-check"/></svg><span class="item-main"><span class="item-name">Cache de Cargo</span></span><span class="status status--ok">Supprimé</span><span class="item-size">6,1 Go</span></div>
          <div class="item item--static" style="min-height: 56px; background: var(--color-accent-soft)"><svg class="ic" aria-hidden="true" style="color: var(--color-accent)"><use href="#i-search"/></svg><span class="item-main"><span class="item-name">Cache de Firefox</span></span><span class="status status--info">En cours…</span><span class="item-size">1,9 Go</span></div>
          <div class="item item--static" style="min-height: 56px"><span class="dot" aria-hidden="true"></span><span class="item-main"><span class="item-name">Dossier de projet ancien</span></span><span class="status status--neutral">En attente</span><span class="item-size">1,3 Go</span></div>
          <div class="item item--static" style="min-height: 56px"><span class="dot" aria-hidden="true"></span><span class="item-main"><span class="item-name">Ancien installeur (.deb)</span></span><span class="status status--neutral">En attente</span><span class="item-size">180 Mo</span></div>
        </div>
      </div>

      <div class="stack" style="align-items: flex-start; gap: 6px">
        <sc-if value="{{w.running}}" hint-placeholder-val="{{ true }}"><button class="btn btn--secondary"><svg class="ic" aria-hidden="true"><use href="#i-stop"/></svg>Arrêter</button></sc-if>
        <sc-if value="{{w.stopping}}" hint-placeholder-val="{{ false }}"><button class="btn is-disabled" disabled>Arrêt en cours…</button></sc-if>
        <span class="small muted">Arrêter termine l’élément en cours, puis s’arrête. Ce qui est déjà fait reste dans l’historique.</span>
      </div>
    </section>
  </div>
</figure>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2064,"height":1800}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['Accueil', 'Diagnostic', 'Espace disque', 'Historique', 'Réglages'];
    const icons = ['#i-home', '#i-activity', '#i-disk', '#i-history', '#i-sliders'];
    return {
      nav: labels.map((l, i) => ({ label: l, icon: icons[i], current: i === 2 ? 'page' : 'false' })),
      wins: [
        { theme: 'light', caption: 'Clair · en cours', running: true, stopping: false },
        { theme: 'dark', caption: 'Sombre · en cours', running: true, stopping: false },
        { theme: 'light', caption: 'Clair · arrêt demandé', running: false, stopping: true }
      ]
    };
  }
}
</script>
</body>
</html>
