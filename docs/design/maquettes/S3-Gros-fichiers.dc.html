<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>S3 · Gros fichiers et dossiers</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./breathly.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="gal" style="width: 2064px; min-height: 1850px">
<svg class="spr" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" style="fill:var(--color-accent)"/><circle cx="16" cy="16" r="4.5" style="fill:var(--color-on-accent)"/><circle cx="16" cy="16" r="9.5" style="fill:none;stroke:var(--color-on-accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:44 16"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
  <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M5.5 14 8 4h8l2.5 10"/><path d="M7 17.5h.01M11 17.5h.01"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 4v4.5H8"/><path d="M12 8v4.5l3 2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9.5A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M14 3.5V8h4"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2.5h8.5A1.5 1.5 0 0 1 21 10v8.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
  <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M18 14v4a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 5 18V8a1.5 1.5 0 0 1 1.5-1.5H10"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></symbol>
</svg>

<h1 class="gal-title">S3 · Gros fichiers et dossiers</h1>
<p class="gal-note">US-022. Les plus gros fichiers et dossiers du dossier personnel, niveau Décision personnelle : jamais sélectionnables, aucune case à cocher, un seul geste possible : « Ouvrir le dossier ». Mode avancé : chemin complet.</p>

<div class="gal-grid">
<sc-for list="{{wins}}" as="w" hint-placeholder-count="4">
<figure class="gal-fig">
  <figcaption class="gal-cap">{{w.caption}}</figcaption>
  <div class="win" data-theme="{{w.theme}}" lang="fr">
    <aside class="side">
      <div class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#mark"/></svg><span class="brand-name">Breathly</span></div>
      <nav class="nav" aria-label="Navigation principale">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
        <a href="#" aria-current="{{n.current}}" aria-label="{{n.label}}"><svg class="ic" aria-hidden="true"><use href="{{n.icon}}"/></svg><span class="nav-label">{{n.label}}</span></a>
        </sc-for>
      </nav>
      <p class="side-foot">Tout reste sur votre ordinateur.</p>
    </aside>

    <section class="main" style="gap: 20px">
      <div class="row"><button class="btn btn--ghost" style="padding-left: 0"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg>Résultat de l’analyse</button></div>
      <div class="head">
        <div class="row row--wrap" style="gap: 12px">
          <h1 class="h1">Gros fichiers et dossiers</h1>
          <sc-if value="{{w.adv}}" hint-placeholder-val="{{ false }}"><span class="status status--info">Mode avancé</span></sc-if>
        </div>
        <p class="lead">Voici les plus gros éléments de votre dossier personnel. Breathly ne les supprime jamais : à vous de décider.</p>
      </div>

      <sc-if value="{{w.hasItems}}" hint-placeholder-val="{{ true }}">
      <div class="row row--between">
        <span class="risk risk--personal"><svg class="ic" aria-hidden="true"><use href="#i-user"/></svg>Décision personnelle</span>
        <span class="small muted">5 éléments · 29,0 Go</span>
      </div>
      <div class="card card--flush">
        <div class="list">
          <sc-for list="{{w.items}}" as="i" hint-placeholder-count="5">
          <div class="item item--static">
            <svg class="ic item-icon" aria-hidden="true"><use href="{{i.icon}}"/></svg>
            <div class="item-main">
              <span class="item-name">{{i.name}}</span>
              <span class="item-desc">{{i.where}}</span>
              <sc-if value="{{w.adv}}" hint-placeholder-val="{{ false }}"><span class="adv">{{i.path}}</span></sc-if>
            </div>
            <span class="item-size">{{i.size}}</span>
            <button class="btn btn--secondary btn--sm"><svg class="ic ic--sm" aria-hidden="true"><use href="#i-external"/></svg>Ouvrir le dossier</button>
          </div>
          </sc-for>
        </div>
      </div>
      <p class="small muted" style="margin: 0"><svg class="ic ic--sm" aria-hidden="true" style="vertical-align: -3px"><use href="#i-lock"/></svg> Aucune case à cocher : ces éléments ne sont jamais sélectionnés pour un nettoyage.</p>
      </sc-if>

      <sc-if value="{{w.empty}}" hint-placeholder-val="{{ false }}">
      <div class="card card--flat">
        <div class="empty">
          <svg class="ic ic--lg" aria-hidden="true" style="color: var(--color-success-fg)"><use href="#i-check"/></svg>
          <h2 class="h2">Aucun gros fichier trouvé</h2>
          <p class="lead" style="text-align: center">Aucun fichier ou dossier de votre dossier personnel ne dépasse 1 Go.</p>
        </div>
      </div>
      </sc-if>
    </section>
  </div>
</figure>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2064,"height":1850}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['Accueil', 'Diagnostic', 'Espace disque', 'Historique', 'Réglages'];
    const icons = ['#i-home', '#i-activity', '#i-disk', '#i-history', '#i-sliders'];
    const items = [
      { icon: '#i-file', name: 'Conférence-2024-brut.mkv', where: 'Vidéo · dans Vidéos', size: '8,4 Go', path: '~/Vidéos/Conférence-2024-brut.mkv' },
      { icon: '#i-folder', name: 'Machines virtuelles', where: 'Dossier · dans votre dossier personnel', size: '6,2 Go', path: '~/VirtualBox VMs' },
      { icon: '#i-file', name: 'ubuntu-24.04-desktop-amd64.iso', where: 'Image disque · dans Téléchargements', size: '5,8 Go', path: '~/Téléchargements/ubuntu-24.04-desktop-amd64.iso' },
      { icon: '#i-folder', name: 'Montage été', where: 'Dossier · dans Vidéos', size: '4,9 Go', path: '~/Vidéos/Montage-été' },
      { icon: '#i-file', name: 'sauvegarde-photos-2019.zip', where: 'Archive · dans Documents', size: '3,7 Go', path: '~/Documents/sauvegarde-photos-2019.zip' }
    ];
    return {
      nav: labels.map((l, i) => ({ label: l, icon: icons[i], current: i === 2 ? 'page' : 'false' })),
      wins: [
        { theme: 'light', caption: 'Clair · mode simple', items, hasItems: true },
        { theme: 'dark', caption: 'Sombre · mode simple', items, hasItems: true },
        { theme: 'light', adv: true, caption: 'Clair · mode avancé (chemins complets)', items, hasItems: true },
        { theme: 'light', caption: 'Clair · aucun gros fichier', items: [], hasItems: false, empty: true }
      ]
    };
  }
}
</script>
</body>
</html>
