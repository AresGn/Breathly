<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>N2 · Simulation</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./breathly.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="gal" style="width: 2064px; min-height: 1150px">
<svg class="spr" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" style="fill:var(--color-accent)"/><circle cx="16" cy="16" r="4.5" style="fill:var(--color-on-accent)"/><circle cx="16" cy="16" r="9.5" style="fill:none;stroke:var(--color-on-accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:44 16"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
  <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M5.5 14 8 4h8l2.5 10"/><path d="M7 17.5h.01M11 17.5h.01"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 4v4.5H8"/><path d="M12 8v4.5l3 2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8h.01"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2h.01"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7.5A1.5 1.5 0 0 1 4.5 6H9l2 2.5h8.5A1.5 1.5 0 0 1 21 10v8.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/></symbol>
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M7 3.5h7l4 4V19a1.5 1.5 0 0 1-1.5 1.5h-9.5A1.5 1.5 0 0 1 5.5 19V5A1.5 1.5 0 0 1 7 3.5z"/><path d="M14 3.5V8h4"/></symbol>
</svg>

<h1 class="gal-title">N2 · Simulation</h1>
<p class="gal-note">US-032, parcours 3. Rapport de ce qui se passerait, sans rien modifier. L’élément ignoré (ici le cache de Firefox, parce que Firefox est ouvert) est montré avec sa raison. On peut passer au nettoyage ou revenir.</p>

<div class="gal-grid">
<sc-for list="{{wins}}" as="w" hint-placeholder-count="2">
<figure class="gal-fig">
  <figcaption class="gal-cap">{{w.caption}}</figcaption>
  <div class="win" data-theme="{{w.theme}}" lang="fr">
    <aside class="side">
      <div class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#mark"/></svg><span class="brand-name">Breathly</span></div>
      <nav class="nav" aria-label="Navigation principale">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
        <a href="#" aria-current="{{n.current}}" aria-label="{{n.label}}"><svg class="ic" aria-hidden="true"><use href="{{n.icon}}"/></svg><span class="nav-label">{{n.label}}</span></a>
        </sc-for>
      </nav>
      <p class="side-foot">Tout reste sur votre ordinateur.</p>
    </aside>

    <section class="main" style="gap: 20px">
      <div class="banner banner--info" role="status">
        <svg class="ic" aria-hidden="true"><use href="#i-info"/></svg>
        <div class="grow"><span class="banner-title">Simulation : rien n’a été modifié.</span> Voici seulement ce qui se passerait.</div>
      </div>
      <h1 class="h1">Ce qui se passerait</h1>

      <div class="stack" style="gap: 8px">
        <div class="row" style="gap: 10px"><svg class="ic" aria-hidden="true" style="color: var(--color-accent)"><use href="#i-undo"/></svg><h2 class="h3">Serait envoyé à la corbeille</h2><span class="small muted">2 éléments · 1,5 Go</span></div>
        <div class="card card--flush"><div class="list">
          <div class="item item--static" style="min-height: 52px"><svg class="ic item-icon" aria-hidden="true"><use href="#i-folder"/></svg><span class="item-main"><span class="item-name">Dossier de projet ancien</span></span><span class="item-size">1,3 Go</span></div>
          <div class="item item--static" style="min-height: 52px"><svg class="ic item-icon" aria-hidden="true"><use href="#i-file"/></svg><span class="item-main"><span class="item-name">Ancien installeur (.deb)</span></span><span class="item-size">180 Mo</span></div>
        </div></div>
      </div>

      <div class="stack" style="gap: 8px">
        <div class="row" style="gap: 10px"><svg class="ic" aria-hidden="true" style="color: var(--color-alert-fg)"><use href="#i-trash"/></svg><h2 class="h3">Serait supprimé définitivement</h2><span class="small muted">2 éléments · 10,3 Go</span></div>
        <div class="card card--flush"><div class="list">
          <div class="item item--static" style="min-height: 52px"><svg class="ic item-icon" aria-hidden="true"><use href="#i-folder"/></svg><span class="item-main"><span class="item-name">Cache de npm</span></span><span class="item-size">4,2 Go</span></div>
          <div class="item item--static" style="min-height: 52px"><svg class="ic item-icon" aria-hidden="true"><use href="#i-folder"/></svg><span class="item-main"><span class="item-name">Cache de Cargo</span></span><span class="item-size">6,1 Go</span></div>
        </div></div>
      </div>

      <div class="stack" style="gap: 8px">
        <div class="row" style="gap: 10px"><svg class="ic" aria-hidden="true" style="color: var(--color-warn-fg)"><use href="#i-alert"/></svg><h2 class="h3">Serait ignoré</h2><span class="small muted">1 élément</span></div>
        <div class="card card--flush"><div class="list">
          <div class="item item--static" style="min-height: 64px"><svg class="ic item-icon" aria-hidden="true"><use href="#i-folder"/></svg><span class="item-main"><span class="item-name">Cache de Firefox</span><span class="item-desc">Firefox est ouvert : son cache est en cours d’utilisation. Fermez-le puis relancez le nettoyage.</span></span><span class="status status--warn">Ignoré</span></div>
        </div></div>
      </div>

      <div class="card card--soft row row--between">
        <span>Espace qui serait libéré</span>
        <span><b class="num">10,3 Go</b> <span class="small muted">tout de suite, puis 1,5 Go au vidage de la corbeille</span></span>
      </div>

      <div class="row row--between" style="margin-top: auto">
        <button class="btn btn--ghost" style="padding-left: 0"><svg class="ic" aria-hidden="true"><use href="#i-back"/></svg>Revenir à la sélection</button>
        <button class="btn btn--primary">Passer au nettoyage</button>
      </div>
    </section>
  </div>
</figure>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2064,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['Accueil', 'Diagnostic', 'Espace disque', 'Historique', 'Réglages'];
    const icons = ['#i-home', '#i-activity', '#i-disk', '#i-history', '#i-sliders'];
    return {
      nav: labels.map((l, i) => ({ label: l, icon: icons[i], current: i === 2 ? 'page' : 'false' })),
      wins: [
        { theme: 'light', caption: 'Clair' },
        { theme: 'dark', caption: 'Sombre' }
      ]
    };
  }
}
</script>
</body>
</html>
