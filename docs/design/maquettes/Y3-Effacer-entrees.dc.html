<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Y3 · Effacer les entrées non annulables</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./breathly.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="gal" style="width: 2064px; min-height: 1150px">
<svg class="spr" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" style="fill:var(--color-accent)"/><circle cx="16" cy="16" r="4.5" style="fill:var(--color-on-accent)"/><circle cx="16" cy="16" r="9.5" style="fill:none;stroke:var(--color-on-accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:44 16"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
  <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M5.5 14 8 4h8l2.5 10"/><path d="M7 17.5h.01M11 17.5h.01"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 4v4.5H8"/><path d="M12 8v4.5l3 2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8h.01"/></symbol>
</svg>

<h1 class="gal-title">Y3 · Effacer les entrées non annulables</h1>
<p class="gal-note">US-040.3. Confirmation : nombre d’entrées concernées et ce qui reste (les entrées annulables et annulées). Seule la liste de l’historique est effacée, jamais un fichier. Le bouton sûr garde le focus par défaut.</p>

<div class="gal-grid">
<sc-for list="{{wins}}" as="w" hint-placeholder-count="2">
<figure class="gal-fig">
  <figcaption class="gal-cap">{{w.caption}}</figcaption>
  <div class="win" data-theme="{{w.theme}}" lang="fr">
    <aside class="side">
      <div class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#mark"/></svg><span class="brand-name">Breathly</span></div>
      <nav class="nav" aria-label="Navigation principale">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
        <a href="#" aria-current="{{n.current}}" aria-label="{{n.label}}"><svg class="ic" aria-hidden="true"><use href="{{n.icon}}"/></svg><span class="nav-label">{{n.label}}</span></a>
        </sc-for>
      </nav>
      <p class="side-foot">Tout reste sur votre ordinateur.</p>
    </aside>

    <section class="main" style="gap: 20px" aria-hidden="true">
      <div class="head"><h1 class="h1">Historique</h1><p class="lead">Tout ce que Breathly a nettoyé. Ce qui est allé à la corbeille peut être annulé.</p></div>
      <div class="card card--flush"><div class="list">
        <div class="item item--static"><span class="item-main"><span class="item-name">Cache de npm</span><span class="item-desc">05 h 02 · Supprimé définitivement</span></span><span class="item-size">4,2 Go</span><span class="status status--neutral">Plus annulable</span></div>
        <div class="item item--static"><span class="item-main"><span class="item-name">Cache de Cargo</span><span class="item-desc">05 h 02 · Supprimé définitivement</span></span><span class="item-size">6,1 Go</span><span class="status status--neutral">Plus annulable</span></div>
        <div class="item item--static"><span class="item-main"><span class="item-name">Dossier de projet ancien</span><span class="item-desc">05 h 03 · Envoyé à la corbeille</span></span><span class="item-size">1,3 Go</span><span class="status status--info">Annulable</span></div>
      </div></div>
    </section>

    <div class="scrim">
      <div class="dialog" role="alertdialog" aria-labelledby="y3t" aria-describedby="y3d">
        <div class="row" style="gap: 16px">
          <div class="dialog-icon dialog-icon--info"><svg class="ic ic--lg" aria-hidden="true"><use href="#i-info"/></svg></div>
          <h2 id="y3t" class="h2">Effacer 4 entrées de l’historique ?</h2>
        </div>
        <div id="y3d" class="stack" style="gap: 8px">
          <p style="margin: 0">Ces 4 entrées concernent des éléments qui ne peuvent plus être annulés (suppressions définitives).</p>
          <p class="small muted" style="margin: 0">Il restera 3 entrées : 2 annulables et 1 déjà annulée. Seule la liste est effacée, aucun fichier n’est touché.</p>
        </div>
        <div class="dialog-actions">
          <button class="btn btn--secondary is-focus">Annuler</button>
          <button class="btn btn--primary">Effacer les 4 entrées</button>
        </div>
      </div>
    </div>
  </div>
</figure>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2064,"height":1150}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['Accueil', 'Diagnostic', 'Espace disque', 'Historique', 'Réglages'];
    const icons = ['#i-home', '#i-activity', '#i-disk', '#i-history', '#i-sliders'];
    return {
      nav: labels.map((l, i) => ({ label: l, icon: icons[i], current: i === 3 ? 'page' : 'false' })),
      wins: [{ theme: 'light', caption: 'Clair' }, { theme: 'dark', caption: 'Sombre' }]
    };
  }
}
</script>
</body>
</html>
