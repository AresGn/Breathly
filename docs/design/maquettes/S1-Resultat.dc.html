<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>S1 · Résultat de l'analyse</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./breathly.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="gal" style="width: 2064px; min-height: 2600px">
<svg class="spr" aria-hidden="true">
  <symbol id="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="9" style="fill:var(--color-accent)"/><circle cx="16" cy="16" r="4.5" style="fill:var(--color-on-accent)"/><circle cx="16" cy="16" r="9.5" style="fill:none;stroke:var(--color-on-accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:44 16"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
  <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M5.5 14 8 4h8l2.5 10"/><path d="M7 17.5h.01M11 17.5h.01"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3.5 8.5"/><path d="M3.5 4v4.5H8"/><path d="M12 8v4.5l3 2"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.8 2.8L16 9.5"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.9 3.1-7 7-7s7 3.1 7 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 2.8 19.5h18.4z"/><path d="M12 10v4.5M12 17.2h.01"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.8h.01"/></symbol>
</svg>

<h1 class="gal-title">S1 · Résultat de l’analyse</h1>
<p class="gal-note">US-021, US-030. Espace libérable réparti par niveau de risque, un seul bouton principal. Le total (13,7 Go) ne compte pas la Décision personnelle, montrée à part. États : chargement, rien à nettoyer, résultat partiel (erreur avec explication).</p>

<div class="gal-grid">
<sc-for list="{{wins}}" as="w" hint-placeholder-count="5">
<figure class="gal-fig">
  <figcaption class="gal-cap">{{w.caption}}</figcaption>
  <div class="win" data-theme="{{w.theme}}" lang="fr">
    <aside class="side">
      <div class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#mark"/></svg><span class="brand-name">Breathly</span></div>
      <nav class="nav" aria-label="Navigation principale">
        <sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
        <a href="#" aria-current="{{n.current}}" aria-label="{{n.label}}"><svg class="ic" aria-hidden="true"><use href="{{n.icon}}"/></svg><span class="nav-label">{{n.label}}</span></a>
        </sc-for>
      </nav>
      <p class="side-foot">Tout reste sur votre ordinateur.</p>
    </aside>

    <section class="main">
      <h1 class="h1">Résultat de l’analyse du disque</h1>

      <sc-if value="{{w.partial}}" hint-placeholder-val="{{ false }}">
      <div class="banner banner--warn" role="status">
        <svg class="ic" aria-hidden="true"><use href="#i-alert"/></svg>
        <div class="grow"><span class="banner-title">Résultat partiel.</span> Breathly n’a pas pu lire 2 dossiers (accès refusé par le système). Rien n’a été modifié.</div>
        <button class="btn btn--secondary btn--sm">Réessayer</button>
      </div>
      </sc-if>

      <sc-if value="{{w.loading}}" hint-placeholder-val="{{ false }}">
      <div class="stack" style="gap: 20px">
        <p class="lead">Analyse du disque en cours… Cela prend environ une minute.</p>
        <div class="skel skel--lg" style="width: 50%; height: 44px"></div>
        <div class="skel" style="height: 14px; border-radius: 999px"></div>
        <div class="card card--flush">
          <div class="item item--static"><div class="skel" style="width: 120px; height: 28px; border-radius: 999px"></div><div class="item-main"><div class="skel" style="width: 70%"></div></div><div class="skel" style="width: 56px"></div></div>
          <div class="item item--static"><div class="skel" style="width: 120px; height: 28px; border-radius: 999px"></div><div class="item-main"><div class="skel" style="width: 60%"></div></div><div class="skel" style="width: 56px"></div></div>
          <div class="item item--static"><div class="skel" style="width: 120px; height: 28px; border-radius: 999px"></div><div class="item-main"><div class="skel" style="width: 65%"></div></div><div class="skel" style="width: 56px"></div></div>
        </div>
        <div class="row"><button class="btn btn--secondary">Annuler</button></div>
      </div>
      </sc-if>

      <sc-if value="{{w.empty}}" hint-placeholder-val="{{ false }}">
      <div class="card card--flat">
        <div class="empty">
          <svg class="illus" viewBox="0 0 168 168" aria-hidden="true">
            <circle cx="84" cy="84" r="80" style="fill:var(--color-accent-soft)"/>
            <circle cx="84" cy="84" r="52" style="fill:none;stroke:var(--color-accent);stroke-width:2;opacity:.45"/>
            <circle cx="84" cy="84" r="30" style="fill:var(--color-accent)"/>
            <path d="M70 85l10 10 19-21" style="fill:none;stroke:var(--color-on-accent);stroke-width:5;stroke-linecap:round;stroke-linejoin:round"/>
          </svg>
          <h2 class="h2">Rien à nettoyer pour l’instant</h2>
          <p class="lead" style="text-align: center">Votre disque est en ordre : Breathly n’a trouvé aucun élément à vous proposer.</p>
          <div class="row"><button class="btn btn--secondary">Voir les gros fichiers</button><button class="btn btn--ghost">Retour à l’accueil</button></div>
        </div>
      </div>
      </sc-if>

      <sc-if value="{{w.result}}" hint-placeholder-val="{{ true }}">
      <div class="stack" style="gap: 12px">
        <div class="row" style="align-items: baseline; gap: 12px; flex-wrap: wrap">
          <span class="big">{{w.total}}</span>
          <span class="h3 muted">peuvent être libérés</span>
        </div>
        <div class="stackbar" role="img" aria-label="Répartition : 12,2 Go sans risque, 1,5 Go à vérifier, 8,4 Go de décision personnelle">
          <i class="s-safe" style="flex: 12.2"></i><i class="s-verify" style="flex: 1.5"></i><i class="s-personal" style="flex: 8.4"></i>
        </div>
        <p class="small muted" style="margin: 0">Rien n’est supprimé avant votre accord. Les gros fichiers (décision personnelle) ne sont jamais comptés dans ce total.</p>
      </div>

      <div class="card card--flush">
        <div class="item item--static">
          <span class="risk risk--safe" style="min-width: 150px"><svg class="ic" aria-hidden="true"><use href="#i-check"/></svg>Sans risque</span>
          <div class="item-main"><span class="item-name">3 caches</span><span class="item-desc">Ils se recréent tout seuls : npm, Cargo et Firefox.</span></div>
          <span class="item-size">12,2 Go</span>
        </div>
        <div class="item item--static">
          <span class="risk risk--verify" style="min-width: 150px"><svg class="ic" aria-hidden="true"><use href="#i-eye"/></svg>À vérifier</span>
          <div class="item-main"><span class="item-name">2 éléments</span><span class="item-desc">Un dossier de projet recréable et un ancien téléchargement. Vous choisissez.</span></div>
          <span class="item-size">1,5 Go</span>
        </div>
        <div class="item item--static">
          <span class="risk risk--personal" style="min-width: 150px"><svg class="ic" aria-hidden="true"><use href="#i-user"/></svg>Décision personnelle</span>
          <div class="item-main"><span class="item-name">1 gros fichier</span><span class="item-desc">Dans Vidéos. Breathly vous le montre, mais vous seul décidez.</span></div>
          <span class="item-size">8,4 Go</span>
        </div>
      </div>

      <div class="stack" style="align-items: flex-start; gap: 8px">
        <button class="btn btn--primary btn--lg">Nettoyer ce qui est sans risque</button>
        <div class="row row--wrap" style="gap: 4px">
          <button class="btn btn--ghost">Choisir les éléments</button>
          <button class="btn btn--ghost">Voir les gros fichiers</button>
        </div>
      </div>
      </sc-if>
    </section>
  </div>
</figure>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2064,"height":2600}}'>
class Component extends DCLogic {
  renderVals() {
    const labels = ['Accueil', 'Diagnostic', 'Espace disque', 'Historique', 'Réglages'];
    const icons = ['#i-home', '#i-activity', '#i-disk', '#i-history', '#i-sliders'];
    return {
      nav: labels.map((l, i) => ({ label: l, icon: icons[i], current: i === 2 ? 'page' : 'false' })),
      wins: [
        { theme: 'light', caption: 'Clair · résultat', result: true, total: 'Jusqu’à 13,7 Go' },
        { theme: 'dark', caption: 'Sombre · résultat', result: true, total: 'Jusqu’à 13,7 Go' },
        { theme: 'light', caption: 'Clair · chargement (analyse du disque)', loading: true },
        { theme: 'light', caption: 'Clair · rien à nettoyer', empty: true },
        { theme: 'light', caption: 'Clair · résultat partiel (erreur expliquée)', result: true, partial: true, total: 'Au moins 13,7 Go' }
      ]
    };
  }
}
</script>
</body>
</html>
