[package]
name = "breathly-desktop"
description = "Application de bureau de Breathly (Tauri v2) : fenêtre, commandes vers le cœur, aucune règle métier"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# Suffixe `_lib` : évite le conflit de nom avec le binaire (problème connu sous Windows, rust-lang/cargo#8519).
name = "breathly_desktop_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
breathly-disk = { path = "../../../crates/breathly-disk" }
breathly-platform = { path = "../../../crates/breathly-platform" }
breathly-rules = { path = "../../../crates/breathly-rules" }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
tracing = "=0.1.44"

[dev-dependencies]
breathly-platform = { path = "../../../crates/breathly-platform", features = ["fake"] }
tempfile = "=3.27.0"

[lints]
workspace = true
